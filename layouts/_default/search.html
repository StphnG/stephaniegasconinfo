{{ define "main" }}
<div class="page">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>

  <div class="page-content">
    {{ .Content }}
    
    <div id="search-container">
      <div class="search-form">
        <input type="text" id="search-input" style="width: 100%; padding: 10px; margin: 10px 0;" placeholder="{{ i18n "searchPlaceholder" | default "Search..." }}">
      </div>
      <div id="search-results" style="min-height: 100px;"></div>
    </div>
  </div>
</div>
{{ end }}

{{ define "footer" }}
  {{ partial "footer.html" . }}
  <script>
  // Inline search functionality
  document.addEventListener('DOMContentLoaded', function() {
    console.log('Search page loaded');
    
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    
    if (!searchInput || !searchResults) {
      console.error('Search elements not found');
      return;
    }
    
    // Get the current language
    const currentLang = document.documentElement.lang || 'en';
    
    // Fetch the index
    fetch('/' + currentLang + '/index.json')
      .then(response => response.json())
      .then(data => {
        // Simple search implementation
        searchInput.addEventListener('input', function() {
          const query = this.value.toLowerCase();
          
          if (query.length < 2) {
            searchResults.innerHTML = '';
            return;
          }
          
          // Filter results
          const results = data.filter(item => 
            item.title.toLowerCase().includes(query) ||
            item.content.toLowerCase().includes(query)
          );
          
          // Display results
          if (results.length === 0) {
            searchResults.innerHTML = '<p>No results found</p>';
          } else {
            let html = '<ul style="list-style: none; padding: 0;">';
            results.forEach(result => {
              html += `
                <li style="margin-bottom: 15px; padding: 10px; border: 1px solid #eee;">
                  <a href="${result.uri}"><strong>${result.title}</strong></a>
                  <p>${result.content.substring(0, 150)}...</p>
                </li>
              `;
            });
            html += '</ul>';
            searchResults.innerHTML = html;
          }
        });
        
        // Show ready status
        searchResults.innerHTML = '<p>Search ready - type to begin...</p>';
      })
      .catch(error => {
        console.error('Error loading search index:', error);
        searchResults.innerHTML = '<p>Error loading search index. Please try again later.</p>';
      });
  });
  </script>
{{ end }}
