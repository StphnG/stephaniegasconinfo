{{ if or .Paginator.HasPrev .Paginator.HasNext }}
<div class="pagination">
  {{ if .Paginator.HasPrev }}
  <a href="{{ .Paginator.Prev.URL }}" class="pagination-item">&larr; Previous</a>
  {{ else }}
  <span class="pagination-item pagination-item-disabled">&larr; Previous</span>
  {{ end }}
  
  {{ if .Paginator.HasNext }}
  <a href="{{ .Paginator.Next.URL }}" class="pagination-item">Next &rarr;</a>
  {{ else }}
  <span class="pagination-item pagination-item-disabled">Next &rarr;</span>
  {{ end }}
</div>
{{ end }}
