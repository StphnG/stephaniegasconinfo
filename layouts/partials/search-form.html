<div class="search-container">
  <form id="search-form" action="{{ "search" | relLangURL }}/" method="get">
    <input type="text" id="search-query" name="q" placeholder="{{ i18n "searchPlaceholder" | default "Search..." }}">
    <button type="submit">{{ i18n "search" | default "Search" }}</button>
  </form>
</div>
