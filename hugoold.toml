baseURL = "https://stephaniegascon.info/"
languageCode = "en-SG"
title = "Stephanie Gascon"
theme = "Ed"

# Multilingual settings
defaultContentLanguage = "en"

[languages.en]
  languageName = "English"
  weight = 1
  
    [[languages.en.menu.main]]
      name = "Home"
      url = "/"
      weight = 1
    [[languages.en.menu.main]]
      name = "Blog"
      url = "/posts/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Links"
      url = "/links/"
      weight = 3

[languages.ja]
  languageName = "日本語"
  weight = 2
  title = "ステファニー・ガスコン"

    [[languages.ja.menu.main]]
      name = "ホーム"
      url = "/ja/"
      weight = 1
    [[languages.ja.menu.main]]
      name = "ブログ"
      url = "/ja/posts/"
      weight = 2
    [[languages.ja.menu.main]]
      name = "リンク"
      url = "/ja/links/"
      weight = 3

[params]
  showShareButtons = true
  showReadingTime = true
  showPostNavLinks = true
  
  [params.homeInfoParams]
    Title = "Welcome to My Website"
    Content = "Brief CV-style profile description goes here"
  
  [params.footer]
    copyright = "© 2025 Stephanie Gascon"
    termsURL = "/terms/"
  
  languageSwitcher = true
[module]

  [[module.imports]]
    path = 'github.com/sergeyklay/gohugo-theme-ed'